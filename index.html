<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nala - Daily Tracker</title>
    <!-- Import Font dari Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #2C3E50;
            --bg-card: #3E5266;
            --text-main: #F8F9FA;
            --text-muted: #9BBAD4;
            --accent: #5D7A94;
            --btn-blue: #7E9CB9;
            --btn-skip: #4A6278;
            --calendar-active: #9BBAD4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Font Baru Diterapkan Di Sini */
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            position: relative;
            padding: 20px;
            padding-bottom: 80px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        /* --- UI Kalender Mingguan --- */
        .calendar-strip {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 15px;
            scrollbar-width: none; /* Sembunyikan scrollbar di Firefox */
        }
        
        .calendar-strip::-webkit-scrollbar {
            display: none; /* Sembunyikan scrollbar di Chrome/Safari */
        }

        .date-card {
            background-color: var(--bg-card);
            min-width: 55px;
            padding: 10px 5px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .date-card.active {
            background-color: var(--calendar-active);
            color: var(--bg-main);
            font-weight: 700;
        }

        .date-card .day {
            font-size: 11px;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .date-card .date {
            font-size: 18px;
            font-weight: 700;
        }

        /* Kartu Kegiatan */
        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card.skipped {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .card.done {
            border-left: 4px solid var(--text-muted);
        }

        .task-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .task-time {
            font-size: 13px;
            color: var(--text-muted);
        }

        .actual-time {
            font-size: 12px;
            color: #A3D9A5;
            margin-top: 4px;
            display: block;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-done { background-color: var(--btn-blue); color: var(--bg-main); }
        .btn-skip { background-color: var(--btn-skip); }

        .fab {
            position: fixed;
            bottom: 30px;
            right: calc(50% - 240px + 20px);
            background-color: var(--btn-blue);
            color: var(--bg-main);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        @media (max-width: 480px) {
            .fab { right: 20px; }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .modal {
            background-color: var(--bg-card);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
        }

        .modal h2 { font-size: 18px; margin-bottom: 15px; font-weight: 600; }
        
        .modal label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: block;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: inherit;
        }

        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Nala.</h1>
            <p id="month-display">Bulan</p>
        </header>

        <!-- Kalender Mingguan -->
        <div class="calendar-strip" id="calendar-strip">
            <!-- Diisi oleh JavaScript -->
        </div>

        <div id="schedule-list">
            <!-- Kartu kegiatan -->
        </div>

        <div class="fab" onclick="openInsertModal()">+</div>
    </div>

    <!-- Modal Konfirmasi Waktu -->
    <div class="modal-overlay" id="done-modal">
        <div class="modal">
            <h2>Selesai jam berapa?</h2>
            <label>Sesuaikan jika kamu telat mengisi.</label>
            <input type="time" id="actual-time-input">
            <div class="modal-btns">
                <button class="btn-skip" onclick="closeModal('done-modal')">Batal</button>
                <button class="btn-done" onclick="saveDoneTask()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal Sisipkan Kegiatan -->
    <div class="modal-overlay" id="insert-modal">
        <div class="modal">
            <h2>Tambah Jadwal / Matkul</h2>
            <label>Nama Kegiatan</label>
            <input type="text" id="new-task-name" placeholder="Msl: Matkul Kalkulus, Rapat">
            
            <label>Tanggal Pelaksanaan</label>
            <input type="date" id="new-task-date">
            
            <label>Jam Pelaksanaan</label>
            <input type="time" id="new-task-time">
            
            <div class="modal-btns">
                <button class="btn-skip" onclick="closeModal('insert-modal')">Batal</button>
                <button class="btn-done" onclick="saveNewTask()">Tambah</button>
            </div>
        </div>
    </div>

    <script>
        let schedule = [];
        let currentEditingId = null;
        let selectedDate = new Date();

        // Setup UI Tanggal & Bulan
        const monthOptions = { month: 'long', year: 'numeric' };
        document.getElementById('month-display').innerText = selectedDate.toLocaleDateString('id-ID', monthOptions);

        function generateCalendar() {
            const strip = document.getElementById('calendar-strip');
            strip.innerHTML = '';
            
            // Buat 7 hari ke depan
            for(let i = 0; i < 7; i++) {
                let d = new Date();
                d.setDate(d.getDate() + i);
                
                let dayName = d.toLocaleDateString('id-ID', { weekday: 'short' });
                let dateNum = d.getDate();
                let fullDateStr = d.toISOString().split('T')[0];
                
                let isActive = i === 0 ? 'active' : ''; // Hari ini aktif secara default
                
                strip.innerHTML += `
                    <div class="date-card ${isActive}" onclick="changeDate(this, '${fullDateStr}')">
                        <div class="day">${dayName}</div>
                        <div class="date">${dateNum}</div>
                    </div>
                `;
            }
        }

        function changeDate(element, dateStr) {
            // Ubah UI kalender
            document.querySelectorAll('.date-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            // (Nantinya di sini logika untuk memfilter jadwal berdasarkan tanggal yang diklik)
            alert("Fitur filter jadwal untuk tanggal " + dateStr + " siap disambungkan dengan database.");
        }

        async function fetchSalatTimes() {
            try {
                const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Yogyakarta&country=Indonesia&method=11');
                const data = await response.json();
                const timings = data.data.timings;
                
                schedule = [
                    { id: 1, name: 'Salat Subuh & Mandi', planned: timings.Fajr, actual: null, status: 'pending' },
                    { id: 2, name: 'Salat Zuhur', planned: timings.Dhuhr, actual: null, status: 'pending' },
                    { id: 3, name: 'Salat Asar', planned: timings.Asr, actual: null, status: 'pending' },
                    { id: 4, name: 'Salat Maghrib', planned: timings.Maghrib, actual: null, status: 'pending' },
                    { id: 5, name: 'Salat Isya & Istirahat', planned: timings.Isha, actual: null, status: 'pending' }
                ];
                renderSchedule();
            } catch (error) {
                alert("Gagal mengambil data jadwal.");
            }
        }

        function renderSchedule() {
            const list = document.getElementById('schedule-list');
            list.innerHTML = ''; 
            schedule.sort((a, b) => a.planned.localeCompare(b.planned));

            schedule.forEach(task => {
                let cardClass = 'card';
                if (task.status === 'skipped') cardClass += ' skipped';
                if (task.status === 'done') cardClass += ' done';

                let buttons = '';
                if (task.status === 'pending') {
                    buttons = `
                        <div class="btn-group">
                            <button class="btn-skip" onclick="skipTask(${task.id})">Lewati</button>
                            <button class="btn-done" onclick="openDoneModal(${task.id})">Selesai</button>
                        </div>
                    `;
                }

                let actualTimeHtml = task.actual ? `<span class="actual-time">Selesai: ${task.actual}</span>` : '';
                let plannedHtml = task.actual ? `<s>${task.planned}</s>` : task.planned;

                list.innerHTML += `
                    <div class="${cardClass}">
                        <div class="task-info">
                            <h3>${task.name}</h3>
                            <div class="task-time">${plannedHtml} ${actualTimeHtml}</div>
                        </div>
                        ${buttons}
                    </div>
                `;
            });
        }

        function openDoneModal(id) {
            currentEditingId = id;
            const now = new Date();
            document.getElementById('actual-time-input').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('done-modal').style.display = 'flex';
        }

        function saveDoneTask() {
            const actualTime = document.getElementById('actual-time-input').value;
            const taskIndex = schedule.findIndex(t => t.id === currentEditingId);
            
            schedule[taskIndex].actual = actualTime;
            schedule[taskIndex].status = 'done';

            const plannedMins = timeToMins(schedule[taskIndex].planned);
            const actualMins = timeToMins(actualTime);
            const delay = actualMins - plannedMins;

            if (delay > 0) {
                for (let i = taskIndex + 1; i < schedule.length; i++) {
                    if (schedule[i].status === 'pending') {
                        schedule[i].planned = minsToTime(timeToMins(schedule[i].planned) + delay);
                    }
                }
            }
            closeModal('done-modal');
            renderSchedule();
        }

        function skipTask(id) {
            schedule.find(t => t.id === id).status = 'skipped';
            renderSchedule();
        }

        function openInsertModal() {
            const now = new Date();
            document.getElementById('new-task-time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('new-task-date').value = now.toISOString().split('T')[0]; // Set default ke hari ini
            document.getElementById('new-task-name').value = '';
            document.getElementById('insert-modal').style.display = 'flex';
        }

        function saveNewTask() {
            const name = document.getElementById('new-task-name').value;
            const time = document.getElementById('new-task-time').value;
            const date = document.getElementById('new-task-date').value;
            
            if (!name || !date) return alert("Nama dan tanggal harus diisi!");
            
            schedule.push({
                id: schedule.length > 0 ? Math.max(...schedule.map(t => t.id)) + 1 : 1,
                name: name,
                planned: time,
                date: date, // Menyimpan tanggal yang dipilih
                actual: null,
                status: 'pending'
            });

            closeModal('insert-modal');
            renderSchedule();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function timeToMins(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return (h * 60) + m;
        }

        function minsToTime(mins) {
            if (mins >= 1440) mins = mins % 1440;
            return `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
        }

        generateCalendar();
        fetchSalatTimes();
    </script>
</body>
</html>
