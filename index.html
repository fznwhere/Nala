<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nala - Beranda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header><h1>Nala.</h1><p>Jadwal Hari Ini</p></header>
        <div id="schedule-list"></div>

        <div class="fab-container">
            <div class="fab-menu" id="fab-menu">
                <button onclick="openModal('Acara')">Acara Bebas</button>
            </div>
            <div class="fab" onclick="toggleFabMenu()">+</div>
        </div>
    </div>

    <!-- Modal Form (Dipakai bareng untuk Acara/Tugas) -->
    <div class="modal-overlay" id="insert-modal">
        <div class="modal">
            <h2 id="modal-title">Tambah</h2>
            <form id="insert-form">
                <input type="hidden" id="current-category">
                <label>Nama Kegiatan *</label>
                <input type="text" id="new-task-name" placeholder="Msl: Rapat Himpunan">
                
                <div id="field-matkul-dropdown" style="display:none;">
                    <label>Pilih Matkul</label>
                    <select id="task-matkul-select"></select>
                    <label>Via / Pengumpulan</label>
                    <input type="text" id="task-via" placeholder="Msl: Google Drive / Offline">
                </div>

                <label>Tanggal Pelaksanaan/Deadline *</label>
                <input type="date" id="new-task-date">
                
                <label>Jam *</label>
                <input type="time" id="new-task-time">

                <label>Catatan / Deskripsi (Opsional)</label>
                <textarea id="new-task-desc" rows="2" placeholder="Tulis rincian..."></textarea>
                
                <div id="field-warna" style="display: none;">
                    <label>Warna Penanda</label>
                    <input type="color" id="new-task-color" value="#A3D9A5">
                </div>
            </form>
            <div class="modal-btns">
                <button onclick="closeModal('insert-modal')" style="background:var(--bg-card); color:white;">Batal</button>
                <button class="btn-save" onclick="saveNewTask()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Navigasi Bawah -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="kalender.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
        <a href="matkul.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
