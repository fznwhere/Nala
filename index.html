<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pola - Beranda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header><h1>Pola.</h1><p>Hari Ini</p></header>
        
        <div id="schedule-list"></div>

        <div class="upcoming-container">
            <h2 class="section-title">Tugas Belum Selesai</h2>
            <div id="upcoming-list"></div>
        </div>

        <div class="history-container">
            <h2 class="section-title">Riwayat Selesai</h2>
            <div class="history-tabs">
                <button class="tab-btn active" id="tab-tk" onclick="renderHistory('Tugas Kuliah')">Tugas Kuliah</button>
                <button class="tab-btn" id="tab-tb" onclick="renderHistory('Tugas')">Tugas</button>
            </div>
            <div id="history-list"></div>
        </div>

        <div class="fab-container">
            <div class="fab-menu" id="fab-menu">
                <button onclick="openModal('Rutinitas')">Rutinitas</button>
                <button onclick="openModal('Acara')">Acara</button>
            </div>
            <div class="fab" onclick="toggleFabMenu()"></div>
        </div>
    </div>

    <!-- Modal Form (Sama) -->
    <div class="modal-overlay" id="insert-modal">
        <div class="modal">
            <h2 id="modal-title">Tambah</h2>
            <form id="insert-form">
                <input type="hidden" id="current-category">
                <label>Nama Kegiatan *</label><input type="text" id="new-task-name">
                <div id="field-rutinitas-hari" style="display: none;">
                    <label>Pilih Hari Rutinitas *</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="routine-days" value="Senin">Sen</label>
                        <label><input type="checkbox" name="routine-days" value="Selasa">Sel</label>
                        <label><input type="checkbox" name="routine-days" value="Rabu">Rab</label>
                        <label><input type="checkbox" name="routine-days" value="Kamis">Kam</label>
                        <label><input type="checkbox" name="routine-days" value="Jumat">Jum</label>
                        <label><input type="checkbox" name="routine-days" value="Sabtu">Sab</label>
                        <label><input type="checkbox" name="routine-days" value="Minggu">Min</label>
                    </div>
                </div>
                <div id="field-tanggal"><label>Tanggal *</label><input type="date" id="new-task-date"></div>
                <label>Jam *</label><input type="time" id="new-task-time">
                <label>Deskripsi (Opsional)</label><textarea id="new-task-desc" rows="2"></textarea>
                <div id="field-warna" style="display: none;"><label>Warna Penanda</label><input type="color" id="new-task-color" value="#059669"></div>
            </form>
            <div class="modal-btns">
                <button onclick="closeModal('insert-modal')" class="btn-cancel">Batal</button>
                <button class="btn-save" onclick="saveNewTask()">Simpan</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="kalender.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
        <a href="matkul.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
