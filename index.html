<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nala - Daily Tracker</title>
    <style>
        /* Palet Warna Muted Navy */
        :root {
            --bg-main: #2C3E50;
            --bg-card: #3E5266;
            --text-main: #F8F9FA;
            --text-muted: #9BBAD4;
            --accent: #5D7A94;
            --btn-blue: #7E9CB9;
            --btn-skip: #4A6278;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        /* Mobile Layout Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            position: relative;
            padding: 20px;
            padding-bottom: 80px;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Kartu Kegiatan */
        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card.skipped {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .card.done {
            border-left: 4px solid var(--text-muted);
        }

        .task-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .task-time {
            font-size: 13px;
            color: var(--text-muted);
        }

        .actual-time {
            font-size: 12px;
            color: #A3D9A5; /* Hijau pastel lembut untuk waktu aktual */
            margin-top: 4px;
            display: block;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-done {
            background-color: var(--btn-blue);
        }

        .btn-skip {
            background-color: var(--btn-skip);
        }

        /* Floating Action Button (FAB) */
        .fab {
            position: fixed;
            bottom: 30px;
            right: calc(50% - 240px + 20px); /* Menyesuaikan dengan max-width 480px */
            background-color: var(--btn-blue);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* Layar HP kecil fallback untuk letak FAB */
        @media (max-width: 480px) {
            .fab {
                right: 20px;
            }
        }

        /* Modal / Pop-up Jendela Kecil */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .modal {
            background-color: var(--bg-card);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Nala.</h1>
            <p id="date-display">Memuat jadwal...</p>
        </header>

        <div id="schedule-list">
            <!-- Kartu kegiatan akan di-render di sini oleh JavaScript -->
        </div>

        <div class="fab" onclick="openInsertModal()">+</div>
    </div>

    <!-- Modal Konfirmasi Waktu Aktual -->
    <div class="modal-overlay" id="done-modal">
        <div class="modal">
            <h2>Selesai jam berapa?</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Sesuaikan jika kamu telat mengisi.</p>
            <input type="time" id="actual-time-input">
            <div class="modal-btns">
                <button class="btn-skip" onclick="closeModal('done-modal')">Batal</button>
                <button class="btn-done" onclick="saveDoneTask()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal Sisipkan Kegiatan Mendadak -->
    <div class="modal-overlay" id="insert-modal">
        <div class="modal">
            <h2>Sisipkan Kegiatan</h2>
            <input type="text" id="new-task-name" placeholder="Nama kegiatan (Msl: Rapat, Kerkom)">
            <input type="time" id="new-task-time">
            <div class="modal-btns">
                <button class="btn-skip" onclick="closeModal('insert-modal')">Batal</button>
                <button class="btn-done" onclick="saveNewTask()">Tambah</button>
            </div>
        </div>
    </div>

    <script>
        let schedule = [];
        let currentEditingId = null;

        // Format tanggal hari ini
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('id-ID', options);

        // Ambil data API Salat untuk Jogja
        async function fetchSalatTimes() {
            try {
                const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Yogyakarta&country=Indonesia&method=11');
                const data = await response.json();
                const timings = data.data.timings;
                
                // Susun jadwal jangkar
                schedule = [
                    { id: 1, name: 'Salat Subuh & Mandi', planned: timings.Fajr, actual: null, status: 'pending' },
                    { id: 2, name: 'Salat Zuhur', planned: timings.Dhuhr, actual: null, status: 'pending' },
                    { id: 3, name: 'Salat Asar', planned: timings.Asr, actual: null, status: 'pending' },
                    { id: 4, name: 'Salat Maghrib', planned: timings.Maghrib, actual: null, status: 'pending' },
                    { id: 5, name: 'Salat Isya & Istirahat', planned: timings.Isha, actual: null, status: 'pending' }
                ];
                renderSchedule();
            } catch (error) {
                alert("Gagal mengambil data jadwal salat. Pastikan ada koneksi internet.");
            }
        }

        // Render kartu kegiatan ke layar
        function renderSchedule() {
            const list = document.getElementById('schedule-list');
            list.innerHTML = ''; // Bersihkan list
            
            // Urutkan jadwal berdasarkan waktu
            schedule.sort((a, b) => a.planned.localeCompare(b.planned));

            schedule.forEach(task => {
                let cardClass = 'card';
                if (task.status === 'skipped') cardClass += ' skipped';
                if (task.status === 'done') cardClass += ' done';

                let buttons = '';
                if (task.status === 'pending') {
                    buttons = `
                        <div class="btn-group">
                            <button class="btn-skip" onclick="skipTask(${task.id})">Lewati</button>
                            <button class="btn-done" onclick="openDoneModal(${task.id})">Selesai</button>
                        </div>
                    `;
                }

                let actualTimeHtml = task.actual ? `<span class="actual-time">Selesai aktual: ${task.actual}</span>` : '';
                
                // Coret waktu rencana jika sudah ada waktu aktual
                let plannedHtml = task.actual ? `<s>${task.planned}</s>` : task.planned;

                list.innerHTML += `
                    <div class="${cardClass}">
                        <div class="task-info">
                            <h3>${task.name}</h3>
                            <div class="task-time">Rencana: ${plannedHtml} ${actualTimeHtml}</div>
                        </div>
                        ${buttons}
                    </div>
                `;
            });
        }

        // --- Logika Modal Selesai ---
        function openDoneModal(id) {
            currentEditingId = id;
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('actual-time-input').value = `${hours}:${minutes}`;
            document.getElementById('done-modal').style.display = 'flex';
        }

        // Logika DOMINO (Geser jadwal ke bawah)
        function saveDoneTask() {
            const actualTime = document.getElementById('actual-time-input').value;
            const taskIndex = schedule.findIndex(t => t.id === currentEditingId);
            
            schedule[taskIndex].actual = actualTime;
            schedule[taskIndex].status = 'done';

            // Hitung selisih waktu (dalam menit) untuk menggeser jadwal selanjutnya
            const plannedTime = schedule[taskIndex].planned;
            const plannedMins = timeToMins(plannedTime);
            const actualMins = timeToMins(actualTime);
            
            const delay = actualMins - plannedMins;

            // Jika telat, dorong semua jadwal di bawahnya
            if (delay > 0) {
                for (let i = taskIndex + 1; i < schedule.length; i++) {
                    if (schedule[i].status === 'pending') {
                        let newTimeMins = timeToMins(schedule[i].planned) + delay;
                        schedule[i].planned = minsToTime(newTimeMins);
                    }
                }
            }

            closeModal('done-modal');
            renderSchedule();
        }

        function skipTask(id) {
            const taskIndex = schedule.findIndex(t => t.id === id);
            schedule[taskIndex].status = 'skipped';
            renderSchedule();
        }

        // --- Logika Modal Sisipkan Kegiatan ---
        function openInsertModal() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('new-task-time').value = `${hours}:${minutes}`;
            document.getElementById('new-task-name').value = '';
            document.getElementById('insert-modal').style.display = 'flex';
        }

        function saveNewTask() {
            const name = document.getElementById('new-task-name').value;
            const time = document.getElementById('new-task-time').value;
            
            if (!name) return alert("Nama kegiatan harus diisi!");

            // Buat ID baru
            const newId = schedule.length > 0 ? Math.max(...schedule.map(t => t.id)) + 1 : 1;
            
            schedule.push({
                id: newId,
                name: name,
                planned: time,
                actual: null,
                status: 'pending'
            });

            closeModal('insert-modal');
            renderSchedule();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Utility: Ubah "13:30" jadi menit (810)
        function timeToMins(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return (h * 60) + m;
        }

        // Utility: Ubah menit (810) jadi "13:30"
        function minsToTime(mins) {
            // Batasi maksimal 24 jam (1440 menit)
            if (mins >= 1440) mins = mins % 1440;
            const h = String(Math.floor(mins / 60)).padStart(2, '0');
            const m = String(mins % 60).padStart(2, '0');
            return `${h}:${m}`;
        }

        // Jalankan saat aplikasi dibuka
        fetchSalatTimes();
    </script>
</body>
</html>
