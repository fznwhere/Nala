<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nala - Kalender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&#10094;</button>
            <div style="position: relative; cursor: pointer;">
                <h1 style="font-size: 24px; text-align: center; margin-bottom:0;">Kalender.</h1>
                <p id="month-display-text" style="text-align: center; color: var(--text-muted); font-size: 14px; font-weight: bold;"></p>
                <input type="month" id="native-month-picker" style="position: absolute; top:0; left:0; width:100%; height:100%; opacity:0;">
            </div>
            <button onclick="changeMonth(1)">&#10095;</button>
        </div>

        <div class="calendar-grid" id="calendar-grid"></div>

        <!-- Kolom Tugas Mendatang (Hitung Mundur) -->
        <div class="upcoming-container">
            <h2 style="font-size: 16px; margin-bottom: 10px;">Tugas Belum Selesai</h2>
            <div id="upcoming-list"></div>
        </div>

        <!-- Kolom Riwayat Tugas -->
        <div class="history-container">
            <h2 style="font-size: 16px;">Riwayat Selesai</h2>
            <div class="history-tabs">
                <button class="tab-btn active" id="tab-tk" onclick="renderHistory('Tugas Kuliah')">Tugas Kuliah</button>
                <button class="tab-btn" id="tab-tb" onclick="renderHistory('Tugas')">Tugas Biasa</button>
            </div>
            <div id="history-list"></div>
        </div>

        <!-- (Sisa kode Modal Day Details, Modal Edit Matkul, dan Modal Insert sama seperti sebelumnya) -->
        <div class="fab-container">
            <div class="fab-menu" id="fab-menu">
                <button onclick="openModal('Tugas Kuliah')">Tugas Kuliah</button>
                <button onclick="openModal('Tugas')">Tugas Biasa</button>
            </div>
            <div class="fab" onclick="toggleFabMenu()">+</div>
        </div>
    </div>
    
    <!-- (Abaikan penulisan ulang modal di sini agar pesan tidak terlalu panjang, kamu cukup copy-paste kerangka modal dari file kalender sebelumnya) -->
    
    <nav class="bottom-nav">
        <!-- Ikon navigasi sama seperti sebelumnya -->
        <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="kalender.html" class="nav-item active"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
        <a href="matkul.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
