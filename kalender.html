<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nala - Kalender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Kalender.</h1>
            <p id="month-display">Bulan Tahun</p>
        </header>

        <!-- Grid Kalender Sebulan Penuh -->
        <div class="calendar-grid" id="calendar-grid">
            <!-- Render via JavaScript -->
        </div>

        <!-- Menu Tambah Kategori -->
        <div class="fab-container">
            <div class="fab-menu" id="fab-menu">
                <button class="btn-matkul" onclick="openModal('Matkul')">Jadwal Matkul</button>
                <button class="btn-tugas" onclick="openModal('Tugas')">Tugas Kuliah</button>
                <button class="btn-acara" onclick="openModal('Acara')">Acara Bebas</button>
            </div>
            <div class="fab" onclick="toggleFabMenu()">+</div>
        </div>
    </div>

    <!-- Modal Input (Sama dengan Index) -->
    <div class="modal-overlay" id="insert-modal">
        <div class="modal">
            <h2 id="modal-title">Tambah Jadwal</h2>
            <input type="text" id="new-task-name" placeholder="Nama Kegiatan...">
            <input type="date" id="new-task-date">
            <input type="time" id="new-task-time">
            <div class="modal-btns" style="text-align: right;">
                <button onclick="closeModal()" style="background:var(--bg-main); color:white;">Batal</button>
                <button class="btn-save" onclick="saveNewTask()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">🏠 Beranda</a>
        <a href="kalender.html" class="nav-item active">📅 Kalender</a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
