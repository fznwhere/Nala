<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nala - Kalender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&#10094;</button>
            <div style="position: relative; cursor: pointer;">
                <h1 style="font-size: 24px; text-align: center; margin-bottom:0;">Kalender.</h1>
                <p id="month-display-text" style="text-align: center; color: var(--text-muted); font-size: 14px; font-weight: bold;"></p>
                <input type="month" id="native-month-picker" style="position: absolute; top:0; left:0; width:100%; height:100%; opacity:0;">
            </div>
            <button onclick="changeMonth(1)">&#10095;</button>
        </div>

        <div class="calendar-grid" id="calendar-grid"></div>

        <!-- Kolom Riwayat Tugas -->
        <div class="history-container">
            <h2 style="font-size: 16px;">Riwayat Selesai</h2>
            <div class="history-tabs">
                <button class="tab-btn active" id="tab-tk" onclick="renderHistory('Tugas Kuliah')">Tugas Kuliah</button>
                <button class="tab-btn" id="tab-tb" onclick="renderHistory('Tugas')">Tugas Biasa</button>
            </div>
            <div id="history-list"></div>
        </div>

        <div class="fab-container">
            <div class="fab-menu" id="fab-menu">
                <button onclick="openModal('Tugas Kuliah')">Tugas Kuliah</button>
                <button onclick="openModal('Tugas')">Tugas Biasa</button>
            </div>
            <div class="fab" onclick="toggleFabMenu()">+</div>
        </div>
    </div>

    <!-- Modal Day Details -->
    <div class="modal-overlay" id="day-detail-modal">
        <div class="modal">
            <h2 id="detail-date-title" style="font-size: 16px; margin-bottom: 15px;">Jadwal</h2>
            <div id="detail-list" style="margin-bottom: 20px; max-height: 50vh; overflow-y: auto;"></div>
            <div style="text-align: right;"><button onclick="closeModal('day-detail-modal')" class="btn-save">Tutup</button></div>
        </div>
    </div>

    <!-- Modal Edit/Reschedule Matkul Khusus Hari Itu -->
    <div class="modal-overlay" id="reschedule-modal">
        <div class="modal">
            <h2 style="font-size: 16px;">Ubah Jadwal Matkul Ini</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">(Hanya mengubah jadwal hari ini, minggu depan tetap normal)</p>
            
            <input type="hidden" id="res-matkulId">
            <input type="hidden" id="res-originalDate">
            
            <label>Pindah ke Tanggal</label>
            <input type="date" id="res-date">
            <label>Ubah Jam</label>
            <input type="time" id="res-time">
            <label>Ubah Ruangan / Via</label>
            <input type="text" id="res-ruang" placeholder="Msl: Zoom / Ruang 2">
            <label>Dosen Pengganti (Jika ada)</label>
            <input type="text" id="res-dosen">

            <div class="modal-btns">
                <button onclick="closeModal('reschedule-modal')" style="background:var(--bg-card); color:white;">Batal</button>
                <button class="btn-save" onclick="saveReschedule()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal Tambah/Edit Tugas (Dari Index) -->
    <div class="modal-overlay" id="insert-modal">
        <div class="modal">
            <h2 id="modal-title">Tambah</h2>
            <form id="insert-form">
                <input type="hidden" id="current-category">
                <label>Nama / Judul *</label>
                <input type="text" id="new-task-name" placeholder="Msl: Makalah Kelompok">
                <div id="field-matkul-dropdown" style="display:none;">
                    <label>Mata Kuliah</label>
                    <select id="task-matkul-select"></select>
                    <label>Pengumpulan</label>
                    <input type="text" id="task-via" placeholder="Msl: G-Drive / E-Learning">
                </div>
                <label>Tgl Deadline *</label><input type="date" id="new-task-date">
                <label>Jam Deadline *</label><input type="time" id="new-task-time">
                <label>Deskripsi</label><textarea id="new-task-desc" rows="2"></textarea>
                <div id="field-warna" style="display: none;"><label>Warna</label><input type="color" id="new-task-color"></div>
            </form>
            <div class="modal-btns">
                <button onclick="closeModal('insert-modal')" style="background:var(--bg-card); color:white;">Batal</button>
                <button class="btn-save" onclick="saveNewTask()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Navigasi -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="kalender.html" class="nav-item active"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></a>
        <a href="matkul.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
